name: Run Tests

on:
  pull_request:
  workflow_dispatch:
  
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dependencies
        run: pip install ".[dev]"

      - name: Run pytest
        run: pytest tests/
